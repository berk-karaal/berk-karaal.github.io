bookmarks:
  - title: Knative
    description: |
        Serverless on your own Kubernetes cluster. Serving runs containers behind HTTP and
        scales them with traffic, down to zero when idle; Eventing wires services together
        with an event broker, so you get Lambda-style deployment without leaving Kubernetes.
    tags: [k8s]
    links:
      - text: Website
        url: https://knative.dev/

  - title: dust
    description: |
        More intuitive du. Shows which directories eat the disk space, sorted by size with
        colored bars, no flags needed.
    tags: [Tools]
    links:
      - text: GitHub
        url: https://github.com/bootandy/dust

  - title: delta
    description: |
        Better diff visualizer for git. Syntax-highlighted, word-level diffs with line numbers
        and an optional side-by-side view; drop-in replacement for the default git pager.
    tags: [Tools, Coding]
    links:
      - text: GitHub
        url: https://github.com/dandavison/delta

  - title: croc
    description: |
        Send files and folders between any two computers from the terminal, using a short code
        phrase. End-to-end encrypted, peer-to-peer with relay fallback, no setup or port
        forwarding.
    tags: [Tools]
    links:
      - text: GitHub
        url: https://github.com/schollz/croc

  - title: fresh
    description: |
        Terminal text editor that brings VS Code / Sublime style UX to the command line: standard
        keybindings, mouse support, menus and a command palette, no config needed. Has LSP,
        split panes and an integrated terminal.
    tags: [Tools]
    links:
      - text: GitHub
        url: https://github.com/sinelaw/fresh

  - title: csvlens
    description: |
        Terminal CSV viewer, like less but for CSV. Scroll, search, filter, sort and freeze
        columns from the command line.
    tags: [Tools]
    links:
      - text: GitHub
        url: https://github.com/YS-L/csvlens

  - title: httpYac
    description: |
        Send and test HTTP requests from .http files right inside VS Code, responses shown in the
        editor. Supports variables, environments and assertions; also has a CLI.
    tags: [Tools, Coding]
    links:
      - text: Website
        url: https://httpyac.github.io/guide/installation_vscode.html#installation

  - title: witr
    description: |
        CLI and TUI that traces a running process, port, container or open file back to what
        started it: ancestry chain, service manager, working dir. Cross-platform.
    tags: [Tools]
    links:
      - text: GitHub
        url: https://github.com/pranshuparmar/witr

  - title: qmd
    description: |
        On-device search engine for markdown notes and docs. Keyword, vector and hybrid search
        running locally, exposed over MCP for agents.
    tags: [AI]
    links:
      - text: GitHub
        url: https://github.com/tobi/qmd

  - title: zizmor
    description: |
        Static analysis tool for CI/CD configs. Finds and fixes security issues in GitHub Actions
        workflows, Dependabot and pre-commit: template injection, credential leaks, overly broad
        permissions.
    tags: [CI/CD]
    links:
      - text: GitHub
        url: https://github.com/zizmorcore/zizmor

  - title: 1.111B Class .xyz Domains
    description: |
        6-9 digit numeric .xyz domains (000000.xyz to 999999999.xyz) for 99¢ a year, every year.
    tags: [Other]
    links:
      - text: Website
        url: https://gen.xyz/number

  - title: LiteLLM
    description: |
        Open source LLM gateway that puts 100+ model providers behind a single OpenAI-compatible API.
        Self-hostable proxy with key management, spend tracking and budgets per team.
    tags: [AI]
    links:
      - text: Website
        url: https://www.litellm.ai/
      - text: GitHub
        url: https://github.com/BerriAI/litellm

  - title: drawio-skill
    description: |
        Coding agent drawio diagram generation skill.
    tags: [Agentic]
    links:
      - text: GitHub
        url: https://github.com/Agents365-ai/drawio-skill

  - title: limux
    description: |
