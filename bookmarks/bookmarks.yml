    tags: [Linux App]
    links:
      - text: GitHub
        url: https://github.com/am-will/limux

  - title: MC/DC (Mofidied Condition/Decision Coverage) Coverage
    description: |
        An advanced code coverage method that requires every possible decision/condition combination is covered independently.
        Some high-risk industries such as aviation and medical requires this method.
    tags: [Coding]
    links:
      - text: Wikipedia
        url: https://en.wikipedia.org/wiki/Modified_condition/decision_coverage

  - title: Subdomain Index
