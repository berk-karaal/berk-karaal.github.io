bookmarks:
  - title: witr
    description: |
        CLI and TUI that traces a running process, port, container or open file back to what
        started it: ancestry chain, service manager, working dir. Cross-platform.
    tags: [Tools]
    links:
      - text: GitHub
        url: https://github.com/pranshuparmar/witr

  - title: qmd
    description: |
        On-device search engine for markdown notes and docs. Keyword, vector and hybrid search
        running locally, exposed over MCP for agents.
    tags: [AI]
    links:
      - text: GitHub
        url: https://github.com/tobi/qmd

  - title: zizmor
    description: |
        Static analysis tool for CI/CD configs. Finds and fixes security issues in GitHub Actions
        workflows, Dependabot and pre-commit: template injection, credential leaks, overly broad
        permissions.
    tags: [CI/CD]
    links:
      - text: GitHub
        url: https://github.com/zizmorcore/zizmor

  - title: 1.111B Class .xyz Domains
    description: |
        6-9 digit numeric .xyz domains (000000.xyz to 999999999.xyz) for 99¢ a year, every year.
    tags: [Other]
    links:
      - text: Website
        url: https://gen.xyz/number

  - title: LiteLLM
    description: |
        Open source LLM gateway that puts 100+ model providers behind a single OpenAI-compatible API.
        Self-hostable proxy with key management, spend tracking and budgets per team.
    tags: [AI]
    links:
      - text: Website
        url: https://www.litellm.ai/
